  ctx.globalAlpha=a;ctx.drawImage(xlSp[k],x-sz/2,y-sz/2,sz,sz);
  ctx.globalAlpha=.55+.45*tw;ctx.fillStyle=XL[k];ctx.beginPath();ctx.arc(x,y,1.9,0,6.283);ctx.fill();
  ctx.globalAlpha=1}
function lightsRR(x,y,w,h,r,gap,off){
  r=Math.min(r,h/2,w/2);const sw=w-2*r,sh=h-2*r,ar=Math.PI*r/2,tot=2*sw+2*sh+4*ar,n=Math.max(4,Math.round(tot/gap)),PI=Math.PI;
  for(let i=0;i<n;i++){
    let s=i*tot/n,px,py,a;
    if(s<sw){px=x+r+s;py=y}
    else if((s-=sw)<ar){a=-PI/2+s/r;px=x+w-r+Math.cos(a)*r;py=y+r+Math.sin(a)*r}
    else if((s-=ar)<sh){px=x+w;py=y+r+s}
    else if((s-=sh)<ar){a=s/r;px=x+w-r+Math.cos(a)*r;py=y+h-r+Math.sin(a)*r}
    else if((s-=ar)<sw){px=x+w-r-s;py=y+h}
    else if((s-=sw)<ar){a=PI/2+s/r;px=x+r+Math.cos(a)*r;py=y+h-r+Math.sin(a)*r}
    else if((s-=ar)<sh){px=x;py=y+h-r-s}
    else{s-=sh;a=PI+s/r;px=x+r+Math.cos(a)*r;py=y+r+Math.sin(a)*r}
    xlBulb(px,py,i+(off||0),13)}}
function xlString(x1,y1,cx,cy,x2,y2,n,off){
  ctx.save();ctx.strokeStyle='#07150f';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x1,y1);ctx.quadraticCurveTo(cx,cy,x2,y2);ctx.stroke();
  for(let i=0;i<n;i++){const t=(i+.5)/n,u=1-t,px=u*u*x1+2*u*t*cx+t*t*x2,py=u*u*y1+2*u*t*cy+t*t*y2;
    ctx.fillStyle='#1c3a2c';ctx.fillRect(px-1.5,py-1,3,3);xlBulb(px,py+4,i+(off||0),15)}
  ctx.restore()}
function drawXmasLights(){
  for(let i=0;i<4;i++)xlString(i*160,-2,i*160+80,44,(i+1)*160,-2,8,i*3);
  xlString(0,34,34,190,0,345,13,2);xlString(VW,34,VW-34,190,VW,345,13,5);
  lightsRR(6,VH-22,VW-12,30,15,15,1)}
function drawFloorSnow(){
  const y0=VH-22+3;
  const layer=(col,add,ph,k)=>{ctx.beginPath();ctx.moveTo(0,y0+1);
    for(let x=0;x<=VW;x+=4)ctx.lineTo(x,y0-(add+2.3*Math.sin(x*.045+ph)+1.5*Math.sin(x*.11+ph*2)+.8*Math.sin(x*.27+ph*3)+k));
    ctx.lineTo(VW,y0+1);ctx.closePath();ctx.fillStyle=col;ctx.fill()};
  layer('#a9c6da',12,2,2);
  layer('#d3e5f0',9,1.3,1);
  layer('#f7fbfe',7,.4,0);
  ctx.fillStyle='#ffffff';
  for(let i=0;i<40;i++){const x=(i*47.3)%VW,tw=.5+.5*Math.sin(time*3+i*1.7);ctx.globalAlpha=.25+.6*tw;ctx.fillRect(x,y0-6-((i*13)%7),1.4,1.4)}
  ctx.globalAlpha=1}
function drawBanner(){
  const now=performance.now();if(banT<=now)return;
  const left=banT-now,a=Math.min(1,left/600),k=clamp((6000-left)/220,0,1),sc=1+.3*(1-k);
  ctx.save();ctx.globalAlpha=a;ctx.translate(VW/2,38);ctx.scale(sc,sc);
  setF(ban,26,1,VW-80);const w=Math.min(VW-20,ctx.measureText(ban).width+48);
  ctx.shadowColor='#ff3d7a';ctx.shadowBlur=18;rr(-w/2,-23,w,46,23);ctx.fillStyle='rgba(8,16,14,.95)';ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#f4d37b';ctx.lineWidth=2.5;ctx.stroke();
  ctx.shadowColor='#ff2a55';ctx.shadowBlur=10+4*Math.sin(time*8);ctx.fillStyle='#ff6f8c';ctx.textAlign='center';ctx.fillText(ban,0,ctx.measureText('M').width*.38);ctx.restore()}

/* ---------- safe checkpoint respawn ----------
   Saws, crushers, fire bars, bullets and lasers all run off the level clock (lvT), which restarts at 0 on every respawn.
   That made some checkpoints (e.g. level 7's saw) spawn you straight into a hazard. When respawning at a checkpoint we now
   start the clock at the first moment where the spawn spot stays clear (with a margin) for the next ~0.6s. */
function spawnClear(t,hb,M){
  const old=lvT;lvT=t;let bad=false;
  if(laserHit({x0:hb.x0-M,x1:hb.x1+M,y0:hb.y0,y1:hb.y1},{x0:hb.x0-M,x1:hb.x1+M,y0:hb.y0,y1:hb.y1}))bad=true;
  if(!bad)for(const e of ents){
    if(e.c==='X'){if(hb.x1+M>e.x*T+2&&hb.x0-M<e.x*T+30&&hb.y0-M<48+cdrop(e)){bad=true;break}}
    else{const q=sawPos(e);if(circHit(q[0],q[1],13+M,hb)){bad=true;break}}}
  if(!bad)for(const e of ex){
    if(e.c==='r'||e.c==='q'){for(let k=0;k<fbN(e);k++){const b=fbPos(e,k,t);if(circHit(b[0],b[1],9+M,hb)){bad=true;break}}}
    else if(e.c==='t'||e.c==='T'){for(const b of bullets(e,t)){if(circHit(b[0],b[1],6+M,hb)){bad=true;break}}}
    if(bad)break}

   make a free account (Metered "Open Relay" or Cloudflare Realtime TURN) and either paste its servers into MP_TURN, or paste the
   credentials URL it gives you into MP_TURN_URL (looks like https://YOURAPP.metered.live/api/v1/turn/credentials?apiKey=KEY). */

    if(b.st!=='dying'&&b.st!=='intro'&&b.shA>0&&nx*nx+ny*ny<1.28){boom(u.x,u.y,'#9fe9ff',6,150);b.bul.splice(i,1);continue}
    if(b.st!=='dying'&&b.st!=='intro'&&nx*nx+ny*ny<1){b.bx=u.x;b.by=u.y;b.bul.splice(i,1);bossShot();continue}
