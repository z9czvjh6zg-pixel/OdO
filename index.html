function snap(){return{v:1,lv,cp,deaths,total:+total.toFixed(1),A:{d:A.d?1:0,a:A.a?1:0,p:A.p?1:0},at:Date.now()}}

  const c=s.cp,ok=c&&LV[s.lv].d.some(o=>o[0]==='f'&&o[1]===c.x&&o[2]===c.y);
  return{lv:s.lv,cp:ok?{x:c.x,y:c.y}:null,deaths:Math.max(0,+s.deaths||0),total:Math.max(0,+s.total||0),a:s.A&&s.A.a?1:0,p:s.A&&s.A.p?1:0}}
function hasSave(){return saved>0||!!goodSnap()}
function clearSnap(){sd=null;try{localStorage.removeItem('sr2_save')}catch(e){}}
function saveGame(kind){
  if(!((state==='play'||state==='pause')&&!LV[lv].tor&&lv<=saved)){if(kind==='manual')note('Cannot save here');return false}
  let ok=true;

  if(kind!=='quiet'){saveMsg=ok?(kind==='manual'?'Game saved':'Autosaved'):'Save failed: storage blocked';saveT=(kind==='manual'||!ok)?2.2:1.2}

/* ---------- save code: backup/restore your progress by hand ----------

   Options > SAVE CODE shows a code you can copy; paste it back later to restore everything. */
let codeBox=null;
function makeCode(){
  const o={lv:saved,c:col,sk:sk,prog:P,save:sd,night:night,dark:dk,dunce:dunce,undies:undies,mxt:mxT,cl:cheatList?1:0,em:emc};
  return 'OVO1-'+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function applyCode(txt){
  const m=(txt||'').trim().replace(/\s+/g,'');if(!m.startsWith('OVO1-'))throw new Error('That is not a save code');
  const o=JSON.parse(decodeURIComponent(escape(atob(m.slice(5)))));
  saved=clamp(+o.lv||0,0,NL-1);col=o.c&&typeof o.c==='object'?o.c:{};
  if(o.sk&&typeof o.sk==='object')sk=o.sk;
  if(o.prog&&typeof o.prog==='object')P=Object.assign({xp:0,name:'',pb:{},cl:{},lb:{}},o.prog);
  sd=o.save||null;night=+o.night||0;dk=+o.dark||0;dunce=+o.dunce||0;undies=+o.undies||0;mxT=+o.mxt||0;cheatList=!!(+o.cl);if(o.em&&typeof o.em==='object'){emc=o.em;emSv()}
  coins=Object.keys(col).length;if(coins>=TC)sk.gold=1;
  sv();psv();
  try{const L=localStorage;L.setItem('sr2_night',night);L.setItem('sr2_dark',dk);L.setItem('sr2_dunce',dunce);L.setItem('sr2_undies',undies);L.setItem('sr2_mxt',mxT);L.setItem('sr2_cl',cheatList?1:0);
    if(sd)L.setItem('sr2_save',JSON.stringify(sd));else L.removeItem('sr2_save')}catch(e){}
}
function closeCodeBox(){if(codeBox){codeBox.remove();codeBox=null}}
function openCodeBox(){

  d.innerHTML='<div style="background:#161c2e;color:#e9eef4;border:2px solid #4cf;border-radius:16px;padding:16px;width:min(92vw,460px);box-sizing:border-box">'
   +'<div style="font-size:18px;font-weight:700;margin-bottom:6px">SAVE CODE</div>'
   +'<div style="font-size:13px;color:#9ab;margin-bottom:8px">Copy this code and keep it somewhere safe. To restore progress later, paste a code here and press Load.</div>'
   +'<textarea spellcheck="false" style="width:100%;height:110px;box-sizing:border-box;background:#0d111c;color:#cfe;border:1px solid #456;border-radius:8px;padding:8px;font:12px monospace;resize:none"></textarea>'
   +'<div class="st" style="font-size:13px;min-height:18px;margin:6px 0;color:#ffd23d"></div>'
   +'<div style="display:flex;gap:8px"><button class="cp">Copy</button><button class="ld">Load code</button><button class="cl" style="margin-left:auto">Close</button></div></div>';

  d.querySelectorAll('button').forEach(b=>b.style.cssText='padding:9px 14px;border-radius:10px;border:0;background:#2a7fff;color:#fff;font-size:14px;font-weight:700;cursor:pointer');
  d.querySelector('.cl').style.background='#444a5c';
  try{ta.value=makeCode()}catch(e){ta.value='';st.textContent='Could not build a code'}
  d.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape')closeCodeBox()});
  d.addEventListener('keyup',e=>e.stopPropagation());
  d.addEventListener('pointerdown',e=>e.stopPropagation());
  d.querySelector('.cl').onclick=closeCodeBox;
  d.querySelector('.cp').onclick=()=>{ta.focus();ta.select();let ok=false;
    try{ok=document.execCommand('copy')}catch(e){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(ta.value).then(()=>{st.textContent='Copied!'},()=>{st.textContent='Press Ctrl+C (or long-press) to copy'});return}

    else{const q=sawPos(e);if(circHit(q[0],q[1],13+M,hb)){bad=true;break}}}

    else if(e.c==='t'||e.c==='T'){for(const b of bullets(e,t)){if(circHit(b[0],b[1],6+M,hb)){bad=true;break}}}
